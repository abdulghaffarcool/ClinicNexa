
name: ClinicNexa CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ClinicNexa.sln

      - name: Build solution
        run: dotnet build ClinicNexa.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ClinicNexa.sln --configuration Release --no-build --logger "console;verbosity=normal"
